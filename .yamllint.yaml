extends: relaxed
rules:
  line-length:
    max: 400
    level: error
  new-lines:
    type: unix
    level: error
  new-line-at-end-of-file:
    level: error
  trailing-spaces:
    level: error
  indentation:
    spaces: 2
    indent-sequences: consistent
    level: warning
  comments:
    min-spaces-from-content: 1
    level: warning
ignore: |
  *.lock.yml
  *.lock.yaml
  .venv/
  myvenv/
  venv/
  node_modules/
  projects/
  hermes-profiles/
  docs/reports/
