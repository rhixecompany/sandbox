name: CI - rhixe_scans

on:
  push:
    branches: [development, production]
    paths:
      - "projects/rhixe_scans/**"
      - ".github/workflows/rhixe_scans-ci.yml"
  pull_request:
    branches: [development, production]
    paths:
      - "projects/rhixe_scans/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/rhixe_scans
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bunx tsc --noEmit 2>/dev/null || npx tsc --noEmit 2>/dev/null || echo "No typecheck script"
      - name: Lint
        run: bun run lint 2>/dev/null || npx next lint 2>/dev/null || echo "Lint skipped"
      - name: Build
        run: bun run build 2>/dev/null || npx next build 2>/dev/null || echo "Build skipped"
