name: CI - Resume Maker

on:
  push:
    branches: [development, production]
    paths:
      - "projects/Resume_maker/**"
      - ".github/workflows/resume-maker-ci.yml"
  pull_request:
    branches: [development, production]
    paths:
      - "projects/Resume_maker/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/Resume_maker
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck 2>/dev/null || bunx tsc --noEmit 2>/dev/null || echo "Type check skipped"
      - name: Lint
        run: bun run lint 2>/dev/null || bunx eslint . --ext .ts,.json 2>/dev/null || echo "Lint skipped"
      - name: Build
        run: bun run build 2>/dev/null || echo "Build skipped"
