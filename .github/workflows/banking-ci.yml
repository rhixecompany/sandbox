name: CI - Banking (Next.js 16 + Drizzle + Plaid/Dwolla)

on:
  push:
    branches: [development, production]
    paths:
      - "projects/Banking/**"
      - ".github/workflows/banking-ci.yml"
  pull_request:
    branches: [development, production]
    paths:
      - "projects/Banking/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/Banking
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma/Drizzle
        run: bun run db:generate 2>/dev/null || echo "No db generate script"
      - name: Type check
        run: bun run typecheck 2>/dev/null || bunx tsc --noEmit 2>/dev/null || echo "Type check skipped"
      - name: Lint
        run: bun run lint 2>/dev/null || npx eslint . --ext .ts,.tsx 2>/dev/null || echo "Lint skipped"
      - name: Build
        run: bun run build 2>/dev/null || npx next build 2>/dev/null || echo "Build skipped"
