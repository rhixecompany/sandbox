name: Check Line Endings

on:
  push:
    branches: [staged]
  pull_request:
    branches: [staged]

permissions:
  contents: read

jobs:
  check-line-endings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for CRLF line endings
        run: |
          BAD_FILES=""
          for ext in md yml yaml; do
            FILES=$(find . -name "*.$ext" -not -path '*/{{cookiecutter*' -not -path '*/node_modules/*' 2>/dev/null)
            if [ -n "$FILES" ]; then
              CRLF=$(grep -l $'\r' $FILES 2>/dev/null || true)
              if [ -n "$CRLF" ]; then
                BAD_FILES="$BAD_FILES$CRLF"$'\n'
              fi
            fi
          done
          if [ -z "$BAD_FILES" ]; then
            echo "✅ No CRLF line endings found"
            exit 0
          else
            echo "❌ CRLF line endings found in:"
            echo "$BAD_FILES"
            exit 1
          fi
