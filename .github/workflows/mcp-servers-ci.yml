name: CI - MCP Servers

on:
  push:
    branches: [development, production]
    paths:
      - 'projects/mcp-servers/**'
      - '.github/workflows/mcp-servers-ci.yml'
  pull_request:
    branches: [development, production]
    paths:
      - 'projects/mcp-servers/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: 'projects/mcp-servers/typescript'
            language: 'typescript'
            cmd: 'bun install && bun run typecheck 2>/dev/null || bunx tsc --noEmit 2>/dev/null || echo "TS check skipped"'
          - project: 'projects/mcp-servers/python'
            language: 'python'
            cmd: 'pip install -r requirements.txt 2>/dev/null || echo "No requirements" && python -m py_compile *.py 2>/dev/null || echo "Syntax check"'
          - project: 'projects/mcp-servers/go'
            language: 'go'
            cmd: 'go build ./... 2>/dev/null || echo "Go build skipped"'
          - project: 'projects/mcp-servers/rust'
            language: 'rust'
            cmd: 'cargo check 2>/dev/null || echo "Rust check skipped"'
          - project: 'projects/mcp-servers/java'
            language: 'java'
            cmd: 'mvn compile -q 2>/dev/null || echo "Maven skipped"'
    steps:
      - uses: actions/checkout@v4
      - name: Verify ${{ matrix.language }}
        run: |
          if [ -d "${{ matrix.project }}" ]; then
            cd "${{ matrix.project }}"
            ${{ matrix.cmd }}
          else
            echo "Directory ${{ matrix.project }} not found, skipping"
          fi
