name: CI - University Library JSM

on:
  push:
    branches: [development, production]
    paths:
      - "projects/university-libary-jsm/**"
      - ".github/workflows/university-libary-jsm-ci.yml"
  pull_request:
    branches: [development, production]
    paths:
      - "projects/university-libary-jsm/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/university-libary-jsm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install
      - name: TypeScript type check
        run: bun run tsc --noEmit 2>/dev/null || bunx tsc --noEmit 2>/dev/null || echo "Type check skipped"
      - name: Lint (ESLint)
        run: bun run lint 2>/dev/null || bunx eslint . --ext .ts,.tsx 2>/dev/null || echo "Lint skipped"
      - name: Build (Next.js)
        run: bun run build 2>/dev/null || bunx next build 2>/dev/null || echo "Build skipped"
      - name: Run tests
        run: bun run test 2>/dev/null || bunx jest 2>/dev/null || echo "Tests skipped"
