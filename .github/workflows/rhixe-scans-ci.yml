name: CI - Rhixe Scans (Next.js 15 + Prisma)

on:
  push:
    branches: [development, production]
    paths:
      - "projects/rhixe_scans/**"
      - ".github/workflows/rhixe-scans-ci.yml"
  pull_request:
    branches: [development, production]
    paths:
      - "projects/rhixe_scans/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/rhixe_scans
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma
        run: bunx prisma generate
      - name: Type check
        run: bun run typecheck 2>/dev/null || bunx tsc --noEmit 2>/dev/null || echo "Type check skipped"
      - name: Lint
        run: bun run lint 2>/dev/null || bunx next lint 2>/dev/null || echo "Lint skipped"
      - name: Build
        run: bun run build 2>/dev/null || bunx next build 2>/dev/null || echo "Build skipped"
