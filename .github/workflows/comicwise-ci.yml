name: CI - Comicwise

on:
  push:
    branches: [development, production]
    paths:
      - "projects/comicwise/**"
      - ".github/workflows/comicwise-ci.yml"
  pull_request:
    branches: [development, production]
    paths:
      - "projects/comicwise/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/comicwise
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "latest"
      - uses: oven-sh/setup-bun@v2
        with:
          cache: "pnpm"
          cache-dependency-path: projects/comicwise/pnpm-lock.yaml
      - name: Install dependencies
        run: pbun install --frozen-lockfile
      - name: Type check
        run: pnpm tsc --noEmit 2>/dev/null || echo "Type check skipped"
      - name: Lint
        run: pnpm lint 2>/dev/null || echo "Lint skipped"
      - name: Build
        run: pbun run build 2>/dev/null || echo "Build skipped"
