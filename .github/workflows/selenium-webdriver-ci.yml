name: CI - Selenium WebDriver

on:
  push:
    branches: [development, production]
    paths:
      - "projects/selenium_webdriver/**"
      - ".github/workflows/selenium-webdriver-ci.yml"
  pull_request:
    branches: [development, production]
    paths:
      - "projects/selenium_webdriver/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/selenium_webdriver
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          cache: "bun"
      - name: Install dependencies
        run: bun install --frozen-lockfile 2>/dev/null || bun install
      - name: TypeScript type check
        run: bunx tsc --noEmit 2>/dev/null || echo "No TypeScript config"
      - name: Lint (Prettier)
        run: bun run format:check 2>/dev/null || bunx prettier --check . 2>/dev/null || echo "Prettier skipped"
      - name: Test
        run: bun run test 2>/dev/null || echo "Tests skipped"
