name: Bash Scripts CI
on:
  pull_request:
    paths:
      - "projects/Bash/**"
      - ".github/workflows/**"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          if command -v bun >/dev/null 2>&1; then
            bun install || true
          else
            bun install --frozen-lockfile || true
          fi
      - name: shfmt check
        run: |
          if command -v shfmt >/dev/null 2>&1; then
            shfmt -d .
          else
            echo "shfmt missing; install if you want format checks"
          fi
      - name: ShellCheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck $(git ls-files | grep -E '\.sh$' || true) || true
          else
            echo "shellcheck missing; skipping"
          fi
      - name: Run verify-dryrun
        run: |
          bash ./projects/Bash/tests/verify-dryrun.sh
      - name: Run TypeScript tests
        run: |
          bun run test || bun run test || true
